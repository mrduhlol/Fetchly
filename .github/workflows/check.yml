name: Check app
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      # The Python bridge tests exercise the packaged contract against the
      # same yt-dlp version the app ships.
      - name: Install yt-dlp for bridge tests
        run: python3 -m pip install 'yt-dlp==2026.10.26' 'packaging==25.0'
      - name: Test, lint and build
        run: scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/lite/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fetchly-lite-test
          path: app/build/outputs/apk/lite/preview/app-lite-preview.apk
