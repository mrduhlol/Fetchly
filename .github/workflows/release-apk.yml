name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "fetchly_v${VER}.apk"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/release-notes/v${VER}.md"
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release create "${GITHUB_REF_NAME}" --title "Fetchly ${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE" --latest
            else
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Fetchly ${GITHUB_REF_NAME}" --latest
            fi
          fi
          gh release upload "${GITHUB_REF_NAME}" "fetchly_v${VER}.apk" --clobber
