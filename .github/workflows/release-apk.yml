name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore persistent APK signing key
        env:
          FETCHLY_KEYSTORE: ${{ secrets.FETCHLY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$FETCHLY_KEYSTORE" || { echo "Missing persistent signing key" >&2; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$FETCHLY_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Prepare verified release assets
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')
          TAG="v${VER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "fetchly_${TAG}.apk"
          cp "fetchly_${TAG}.apk" fetchly.apk
          sha256sum "fetchly_${TAG}.apk" fetchly.apk > SHA256SUMS
          printf 'Commit: %s\nVersion: %s\n' "$GITHUB_SHA" "$VER" > BUILD.txt

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="docs/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" = "False" ]; then
              echo "Release $RELEASE_TAG is already published; keeping its assets unchanged."
              exit 0
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Fetchly $RELEASE_TAG" --notes-file "$NOTES_FILE" --draft
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Fetchly $RELEASE_TAG" --notes "Fetchly $RELEASE_TAG, built from $GITHUB_SHA" --draft
            fi
          fi
          gh release upload "$RELEASE_TAG" "fetchly_${RELEASE_TAG}.apk" fetchly.apk SHA256SUMS BUILD.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
