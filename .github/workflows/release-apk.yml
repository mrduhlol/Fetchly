name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FETCHLY_SIGNING_STORE_PASSWORD: ${{ secrets.FETCHLY_RELEASE_STORE_PASSWORD }}
      FETCHLY_SIGNING_KEY_ALIAS: ${{ secrets.FETCHLY_RELEASE_KEY_ALIAS }}
      FETCHLY_SIGNING_KEY_PASSWORD: ${{ secrets.FETCHLY_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android platform
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore verified persistent production signing key
        env:
          FETCHLY_KEYSTORE_BASE64: ${{ secrets.FETCHLY_RELEASE_KEYSTORE_BASE64 || secrets.FETCHLY_DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/prepare-production-signing.sh

      - name: Build full and optimized Lite APKs
        run: ./gradlew :app:assembleFullRelease :app:assembleLiteRelease --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'

      - name: Run unit tests
        run: ./gradlew :app:testFullDebugUnitTest :app:testLiteDebugUnitTest :app:lintFullDebug :app:lintLiteDebug --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'

      - name: Test Python bridge
        run: |
          python3 -m pip install 'yt-dlp==2026.10.26' 'packaging==25.0'
          python3 -m unittest discover -s app/src/test/python -v

      - name: Verify production APK identities
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/full/release/output-metadata.json"))["elements"][0]["versionName"])')
          python3 scripts/verify-production-apk.py --apk app/build/outputs/apk/full/release/app-full-release.apk --package com.fetchly.app.debug --version "$VER" --tools "$ANDROID_SDK_ROOT/build-tools/35.0.0" --output fetchly-release.json
          python3 scripts/verify-production-apk.py --apk app/build/outputs/apk/lite/release/app-lite-release.apk --package com.fetchly.app.lite --version "$VER-lite" --tools "$ANDROID_SDK_ROOT/build-tools/35.0.0" --output fetchly-lite-release.json
          printf 'FETCHLY_SIGNING_CERT_SHA256=%s\n' "$(tr -d '[:space:]' < docs/SIGNING_CERT_SHA256)" >> "$GITHUB_ENV"

      - name: Prepare verified release assets
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/full/release/output-metadata.json"))["elements"][0]["versionName"])')
          TAG="v${VER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/full/release/app-full-release.apk "fetchly_${TAG}.apk"
          cp "fetchly_${TAG}.apk" fetchly.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "fetchly-lite_${TAG}.apk"
          cp "fetchly-lite_${TAG}.apk" fetchly-lite.apk
          sha256sum "fetchly_${TAG}.apk" fetchly.apk "fetchly-lite_${TAG}.apk" fetchly-lite.apk > SHA256SUMS
          printf 'Commit: %s\nVersion: %s\nSigning certificate SHA-256: %s\n' "$GITHUB_SHA" "$VER" "$FETCHLY_SIGNING_CERT_SHA256" > BUILD.txt

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="docs/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" = "False" ]; then
              echo "Release $RELEASE_TAG is already published; keeping its assets unchanged."
              exit 0
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Fetchly $RELEASE_TAG" --notes-file "$NOTES_FILE" --draft
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Fetchly $RELEASE_TAG" --notes "Fetchly $RELEASE_TAG, built from $GITHUB_SHA" --draft
            fi
          fi
          if [ -f "$NOTES_FILE" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
          gh release upload "$RELEASE_TAG" "fetchly_${RELEASE_TAG}.apk" fetchly.apk "fetchly-lite_${RELEASE_TAG}.apk" fetchly-lite.apk SHA256SUMS BUILD.txt fetchly-release.json fetchly-lite-release.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Remove restored private keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fetchly-production-signing.jks"
