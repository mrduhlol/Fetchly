name: Audit APK signer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FETCHLY_SIGNING_STORE_PASSWORD: ${{ secrets.FETCHLY_RELEASE_STORE_PASSWORD }}
      FETCHLY_SIGNING_KEY_ALIAS: ${{ secrets.FETCHLY_RELEASE_KEY_ALIAS }}
      FETCHLY_SIGNING_KEY_PASSWORD: ${{ secrets.FETCHLY_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify persistent production signing identity
        env:
          FETCHLY_KEYSTORE_BASE64: ${{ secrets.FETCHLY_RELEASE_KEYSTORE_BASE64 || secrets.FETCHLY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          bash scripts/prepare-production-signing.sh
          printf 'Verified production certificate SHA-256: '
          cat docs/SIGNING_CERT_SHA256
      - name: Remove restored private keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fetchly-production-signing.jks"
