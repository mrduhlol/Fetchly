org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Parallel builds race Chaquopy against KSP (state-lock failure), so off.
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# compileSdk 35 on AGP 8.5.2: the SDK is newer than the plugin's tested range.
# Accepted (Chaquopy 15.0.1 is happiest on AGP 8.5.x; ffmpeg-kit-full needs SDK 35).
android.suppressUnsupportedCompileSdk=35
