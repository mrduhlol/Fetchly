navigationCompose = "2.7.0"
room = "2.6.1"
workmanager = "2.9.0"
datastore = "1.1.1"
okhttp = "4.12.0"
coil = "2.6.0"
splash = "1.0.1"
ksp = "2.0.20-1.0.25"
coroutines = "1.9.0"
chaquopy = "15.0.1"
